# Vai para o repositório como deploy/nginx-spa.conf (usado pelo estágio front do deploy/Dockerfile).
server {
    # Porta padrão de todos os serviços com domínio (Container Port 3000 no Dokploy)
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão (o alpha-proxy e os proxies próprios faziam isso antes)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Healthcheck da imagem (HEALTHCHECK do Dockerfile)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Arquivos com hash no nome podem ficar em cache por muito tempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca em cache, para os clientes pegarem a versão nova
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback de SPA: rotas do front caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
